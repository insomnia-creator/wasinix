name: GTK WASIX libs

# Spike: build the GTK closure with the WASIX toolchain (wasixcc + WASIX
# sysroot). Plain wasi-libc failed (libffi/emscripten, epoll-shim/signals), so
# this exercises the wasinix-wrapped recipes instead.
#
# Phase 1: libffi, pcre2, expat, wayland, wayland-protocols, glib.
# Remove/replace once wwn-gtk owns its own CI lane.

on:
  workflow_dispatch:
  push:
    branches:
      - "gtk/**"

permissions:
  contents: read

jobs:
  build-libs:
    name: wasix ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package:
          - libffi
          - pcre2
          - expat
          - wayland
          - wayland-protocols
          - glib
          - pixman
          - fribidi
          - harfbuzz
          - fontconfig
          - cairo
          - pango
          - gdk-pixbuf
          - graphene
          - libxkbcommon
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'pkgs/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Build ${{ matrix.package }} with wasixcc
        run: |
          set -euo pipefail
          # The wasixcc wrapper occasionally dies with SIGPIPE on
          # `clang --version`; retry once.
          nix build --print-build-logs --show-trace \
            ".#wasix.libraries.exnrefEh.${{ matrix.package }}" \
            -o "result-${{ matrix.package }}" \
            || nix build --print-build-logs --show-trace \
              ".#wasix.libraries.exnrefEh.${{ matrix.package }}" \
              -o "result-${{ matrix.package }}"
      - name: Inspect output
        run: |
          # `find | head` under pipefail fails with SIGPIPE; do not fail here.
          find "result-${{ matrix.package }}" -maxdepth 3 | head -40 || true
